<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="sky-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F2" />
      <stop offset="100%" stop-color="#EFE3CF" />
    </linearGradient>
    <pattern id="hatch-1" width="8" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#2B2118" stroke-width="0.8" opacity="0.2" />
    </pattern>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="600" fill="url(#sky-grad-1)" rx="24" />

  <!-- Far Mountain Peaks in Soft Sage -->
  <polygon points="120,320 280,180 440,320" fill="#A9AB8C" opacity="0.6" />
  <polygon points="360,340 520,160 680,340" fill="#8B8D69" opacity="0.7" />
  <polygon points="460,220 520,160 580,240" fill="#F3EBDB" opacity="0.8" />

  <!-- Mountain Shading & Hatch -->
  <polygon points="520,160 680,340 520,340" fill="#5E6045" opacity="0.4" />
  <polygon points="280,180 440,320 280,320" fill="url(#hatch-1)" />

  <!-- Serene Lake Water -->
  <path d="M 0 320 C 240 310, 560 310, 800 320 L 800 480 C 560 490, 240 490, 0 480 Z" fill="#98A79B" />
  <g stroke="#FAF6EE" stroke-width="1.4" opacity="0.5">
    <line x1="180" y1="360" x2="260" y2="360" />
    <line x1="320" y1="390" x2="440" y2="390" />
    <line x1="480" y1="370" x2="560" y2="370" />
    <line x1="220" y1="420" x2="380" y2="420" />
    <line x1="520" y1="440" x2="660" y2="440" />
  </g>

  <!-- Lakeside Terracotta Hills & Promontory -->
  <path d="M 0 420 C 180 380, 360 410, 520 460 C 660 500, 740 540, 800 580 L 800 600 L 0 600 Z" fill="#B9643A" />
  <path d="M 0 500 C 160 480, 320 510, 480 560 L 480 600 L 0 600 Z" fill="#8E4526" />

  <!-- Village Cluster on Promontory -->
  <g id="village" transform="translate(220, 340)">
    <!-- House 1 -->
    <rect x="20" y="30" width="36" height="40" fill="#F3EBDB" stroke="#2B2118" stroke-width="1.4" />
    <polygon points="15,30 38,12 61,30" fill="#B9643A" stroke="#2B2118" stroke-width="1.4" />
    <rect x="32" y="48" width="12" height="22" fill="#2B2118" />
    <!-- Church Tower with Bell Arch -->
    <rect x="62" y="10" width="28" height="60" fill="#F8F3EA" stroke="#2B2118" stroke-width="1.4" />
    <polygon points="58,10 76,-8 94,10" fill="#8E4526" stroke="#2B2118" stroke-width="1.4" />
    <rect x="71" y="22" width="10" height="14" rx="5" fill="#2B2118" />
    <!-- House 2 -->
    <rect x="94" y="28" width="42" height="42" fill="#D9A877" stroke="#2B2118" stroke-width="1.4" />
    <polygon points="90,28 115,10 140,28" fill="#B9643A" stroke="#2B2118" stroke-width="1.4" />
    <rect x="108" y="44" width="14" height="26" fill="#2B2118" />
    <!-- Cypress Trees -->
    <path d="M 12 70 C 4 50, 4 30, 12 15 C 20 30, 20 50, 12 70 Z" fill="#5E6045" />
    <path d="M 148 70 C 140 45, 140 25, 148 10 C 156 25, 156 45, 148 70 Z" fill="#5E6045" />
    <path d="M 162 70 C 156 50, 156 35, 162 20 C 168 35, 168 50, 162 70 Z" fill="#757954" />
  </g>

  <!-- Foreground Olive Branch & Leaves -->
  <g transform="translate(620, 460)">
    <path d="M 40 120 C 60 70, 90 30, 140 0" stroke="#2B2118" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="60" cy="80" rx="20" ry="10" transform="rotate(-30 60 80)" fill="#8B8D69" stroke="#2B2118" stroke-width="1.4" />
    <ellipse cx="90" cy="50" rx="22" ry="11" transform="rotate(-15 90 50)" fill="#5E6045" stroke="#2B2118" stroke-width="1.4" />
    <ellipse cx="125" cy="20" rx="18" ry="9" transform="rotate(10 125 20)" fill="#A9AB8C" stroke="#2B2118" stroke-width="1.4" />
  </g>
</svg>
