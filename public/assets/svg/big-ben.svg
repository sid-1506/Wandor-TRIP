<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 260" fill="none">
  <!-- Elizabeth Tower (Big Ben) Sticker -->
  <g filter="drop-shadow(0px 8px 16px rgba(43,33,24,0.18))">
    <!-- White Sticker Backing -->
    <path d="M 40 250 L 45 130 L 35 130 L 42 70 L 68 25 L 80 10 L 92 25 L 118 70 L 125 130 L 115 130 L 120 250 Z" 
          stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" fill="#FFFFFF" />

    <!-- Main Tower Shaft -->
    <rect x="52" y="125" width="56" height="120" fill="#D9A877" stroke="#2B2118" stroke-width="2" />
    <!-- Vertical Gothic Ribs on Shaft -->
    <line x1="64" y1="125" x2="64" y2="245" stroke="#2B2118" stroke-width="1.2" opacity="0.6" />
    <line x1="80" y1="125" x2="80" y2="245" stroke="#2B2118" stroke-width="1.2" opacity="0.6" />
    <line x1="96" y1="125" x2="96" y2="245" stroke="#2B2118" stroke-width="1.2" opacity="0.6" />

    <!-- Clock Room Box -->
    <rect x="46" y="70" width="68" height="55" fill="#F3EBDB" stroke="#2B2118" stroke-width="2" />
    <!-- Clock Face -->
    <circle cx="80" cy="98" r="20" fill="#FAF6EE" stroke="#2B2118" stroke-width="2" />
    <circle cx="80" cy="98" r="16" stroke="#2B2118" stroke-width="0.8" fill="none" />
    <!-- Clock Hands (Big Ben at 10:10) -->
    <line x1="80" y1="98" x2="72" y2="88" stroke="#2B2118" stroke-width="1.8" stroke-linecap="round" />
    <line x1="80" y1="98" x2="92" y2="92" stroke="#2B2118" stroke-width="1.4" stroke-linecap="round" />

    <!-- Gothic Roof & Spire -->
    <polygon points="44,70 70,30 90,30 116,70" fill="#5E6045" stroke="#2B2118" stroke-width="1.8" />
    <!-- Lantern Spire -->
    <polygon points="74,30 80,12 86,30" fill="#D9A877" stroke="#2B2118" stroke-width="1.5" />
    <line x1="80" y1="12" x2="80" y2="4" stroke="#2B2118" stroke-width="2" />
  </g>
</svg>
