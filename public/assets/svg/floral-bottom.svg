<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" fill="none" id="floral-bottom">
  <!-- Garland Vine Running across bottom -->
  <path d="M 0 90 C 260 50, 480 120, 700 80 C 920 40, 1100 110, 1200 80" stroke="#5E6045" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Olive Leaves Clustering along Vine -->
  <g fill="#8B8D69" stroke="#2B2118" stroke-width="1.2">
    <ellipse cx="120" cy="85" rx="18" ry="8" transform="rotate(30 120 85)" />
    <ellipse cx="260" cy="95" rx="20" ry="9" transform="rotate(-25 260 95)" />
    <ellipse cx="420" cy="80" rx="17" ry="8" transform="rotate(40 420 80)" />
    <ellipse cx="560" cy="100" rx="19" ry="9" transform="rotate(-35 560 100)" />
    <ellipse cx="740" cy="75" rx="18" ry="8" transform="rotate(25 740 75)" />
    <ellipse cx="890" cy="95" rx="20" ry="9" transform="rotate(-40 890 95)" />
    <ellipse cx="1080" cy="85" rx="18" ry="8" transform="rotate(30 1080 85)" />
  </g>

  <!-- Terracotta Poppies -->
  <!-- Poppy 1 -->
  <g transform="translate(160, 60)">
    <circle cx="26" cy="26" r="25" fill="#B9643A" stroke="#2B2118" stroke-width="1.4" />
    <circle cx="22" cy="22" r="18" fill="#CE7245" />
    <circle cx="26" cy="26" r="8" fill="#2B2118" />
    <circle cx="26" cy="26" r="3" fill="#FAF6EE" />
  </g>
  <!-- Poppy 2 -->
  <g transform="translate(480, 70)">
    <circle cx="24" cy="24" r="22" fill="#B9643A" stroke="#2B2118" stroke-width="1.4" />
    <circle cx="20" cy="20" r="16" fill="#8E4526" />
    <circle cx="24" cy="24" r="7" fill="#2B2118" />
  </g>
  <!-- Poppy 3 -->
  <g transform="translate(940, 65)">
    <circle cx="26" cy="26" r="24" fill="#B9643A" stroke="#2B2118" stroke-width="1.4" />
    <circle cx="22" cy="22" r="17" fill="#D9A877" opacity="0.85" />
    <circle cx="26" cy="26" r="8" fill="#2B2118" />
  </g>

  <!-- Daisies -->
  <g transform="translate(340, 70)">
    <ellipse cx="20" cy="5" rx="5" ry="12" fill="#FAF6EE" stroke="#2B2118" stroke-width="1" />
    <ellipse cx="20" cy="35" rx="5" ry="12" fill="#FAF6EE" stroke="#2B2118" stroke-width="1" />
    <ellipse cx="5" cy="20" rx="12" ry="5" fill="#FAF6EE" stroke="#2B2118" stroke-width="1" />
    <ellipse cx="35" cy="20" rx="12" ry="5" fill="#FAF6EE" stroke="#2B2118" stroke-width="1" />
    <circle cx="20" cy="20" r="7" fill="#D9A877" stroke="#2B2118" stroke-width="1.2" />
  </g>
  <g transform="translate(800, 75)">
    <ellipse cx="18" cy="5" rx="4" ry="10" fill="#FAF6EE" stroke="#2B2118" stroke-width="1" />
    <ellipse cx="18" cy="31" rx="4" ry="10" fill="#FAF6EE" stroke="#2B2118" stroke-width="1" />
    <ellipse cx="5" cy="18" rx="10" ry="4" fill="#FAF6EE" stroke="#2B2118" stroke-width="1" />
    <ellipse cx="31" cy="18" rx="10" ry="4" fill="#FAF6EE" stroke="#2B2118" stroke-width="1" />
    <circle cx="18" cy="18" r="6" fill="#D9A877" stroke="#2B2118" stroke-width="1.2" />
  </g>

  <!-- Lavender Sprigs -->
  <g transform="translate(630, 65) rotate(25)">
    <line x1="10" y1="0" x2="10" y2="70" stroke="#5E6045" stroke-width="1.6" />
    <ellipse cx="6" cy="15" rx="5" ry="3" fill="#8E859E" />
    <ellipse cx="14" cy="15" rx="5" ry="3" fill="#8E859E" />
    <ellipse cx="6" cy="26" rx="6" ry="3.5" fill="#7D748E" />
    <ellipse cx="14" cy="26" rx="6" ry="3.5" fill="#7D748E" />
  </g>
</svg>
