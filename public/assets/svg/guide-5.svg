<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- guide-5: Roman Forum Ruins & Columns -->
  <rect width="120" height="120" rx="16" fill="#F8F3EA" />
  <!-- Three Standing Temple Columns with Entablature (Temple of Castor and Pollux style) -->
  <rect x="25" y="28" width="55" height="10" fill="#F3EBDB" stroke="#2B2118" stroke-width="1.4" />
  <!-- Columns -->
  <rect x="30" y="38" width="8" height="52" fill="#FAF6EE" stroke="#2B2118" stroke-width="1.2" />
  <rect x="48" y="38" width="8" height="52" fill="#FAF6EE" stroke="#2B2118" stroke-width="1.2" />
  <rect x="66" y="38" width="8" height="52" fill="#FAF6EE" stroke="#2B2118" stroke-width="1.2" />
  <!-- Arch of Septimius Severus on Right -->
  <rect x="78" y="55" width="28" height="35" fill="#D9A877" stroke="#2B2118" stroke-width="1.2" />
  <path d="M 86 90 L 86 70 A 6 6 0 0 1 98 70 L 98 90 Z" fill="#2B2118" />
  <!-- Cypress Tree in background -->
  <path d="M 22 90 C 18 70, 18 55, 22 40 C 26 55, 26 70, 22 90 Z" fill="#5E6045" stroke="#2B2118" stroke-width="1" />
  <!-- Fallen Capitals & Podium -->
  <polygon points="12,98 108,98 102,90 18,90" fill="#B9643A" stroke="#2B2118" stroke-width="1.4" />
</svg>
