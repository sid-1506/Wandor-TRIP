<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <!-- Sky over Rome Rooftops -->
  <linearGradient id="hassler-sky" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FCF9F3" />
    <stop offset="100%" stop-color="#EFE2CD" />
  </linearGradient>
  <rect width="600" height="380" fill="url(#hassler-sky)" rx="16" />

  <!-- Dome of St. Peter's in the Distance -->
  <path d="M 120 220 C 120 180, 140 160, 160 155 C 180 160, 200 180, 200 220 Z" fill="#A9AB8C" opacity="0.6" />
  <line x1="160" y1="155" x2="160" y2="140" stroke="#2B2118" stroke-width="1.6" />

  <!-- Terracotta Rooftops & Chimneys of Rome -->
  <polygon points="40,240 160,200 240,240" fill="#B9643A" stroke="#2B2118" stroke-width="1.4" />
  <polygon points="210,240 320,190 420,240" fill="#8E4526" stroke="#2B2118" stroke-width="1.4" />
  <polygon points="390,240 500,210 580,240" fill="#B9643A" stroke="#2B2118" stroke-width="1.4" />

  <!-- Hassler Penthouse Terrace (Foreground) -->
  <rect x="0" y="240" width="600" height="140" fill="#F3EBDB" stroke="#2B2118" stroke-width="2" />
  <!-- Terracotta Planters & Lemon Trees on Terrace -->
  <rect x="40" y="270" width="50" height="40" fill="#B9643A" stroke="#2B2118" stroke-width="1.4" />
  <ellipse cx="65" cy="250" rx="30" ry="26" fill="#8B8D69" stroke="#2B2118" stroke-width="1.4" />
  <circle cx="55" cy="245" r="4" fill="#E8C547" />
  <circle cx="75" cy="255" r="4" fill="#E8C547" />

  <!-- Terrace Table and Wine Glasses -->
  <g transform="translate(360, 250)">
    <ellipse cx="50" cy="50" rx="45" ry="16" fill="#FAF6EE" stroke="#2B2118" stroke-width="1.4" />
    <rect x="46" y="55" width="8" height="50" fill="#2B2118" />
    <ellipse cx="50" cy="105" rx="20" ry="6" fill="#2B2118" />
    <!-- Wine Bottle & Glasses -->
    <rect x="42" y="30" width="8" height="22" fill="#5E6045" stroke="#2B2118" stroke-width="1" />
    <path d="M 65 38 L 72 38 L 70 48 L 67 48 Z" fill="#D9A877" stroke="#2B2118" stroke-width="1" />
  </g>

  <!-- Wrought Iron Terrace Railing -->
  <line x1="0" y1="240" x2="600" y2="240" stroke="#2B2118" stroke-width="3" />
  <g stroke="#2B2118" stroke-width="1.4">
    <line x1="50" y1="240" x2="50" y2="265" />
    <line x1="100" y1="240" x2="100" y2="265" />
    <line x1="150" y1="240" x2="150" y2="265" />
    <line x1="200" y1="240" x2="200" y2="265" />
    <line x1="250" y1="240" x2="250" y2="265" />
    <line x1="300" y1="240" x2="300" y2="265" />
    <line x1="350" y1="240" x2="350" y2="265" />
    <line x1="400" y1="240" x2="400" y2="265" />
    <line x1="450" y1="240" x2="450" y2="265" />
    <line x1="500" y1="240" x2="500" y2="265" />
    <line x1="550" y1="240" x2="550" y2="265" />
  </g>
</svg>
