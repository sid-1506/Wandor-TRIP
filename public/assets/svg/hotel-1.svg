<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <!-- Sky / Background -->
  <rect width="400" height="260" fill="#F8F4EA" rx="12" />
  <!-- Hotel Hassler Facade (Neoclassical Roman Grand Hotel atop Spanish Steps) -->
  <rect x="50" y="60" width="300" height="180" fill="#F3EBDB" stroke="#2B2118" stroke-width="1.8" />
  <!-- Mansard Terracotta Roof -->
  <polygon points="40,60 70,25 330,25 360,60" fill="#B9643A" stroke="#2B2118" stroke-width="1.8" />
  <!-- Dormer Windows -->
  <rect x="100" y="32" width="22" height="20" rx="3" fill="#F8F4EA" stroke="#2B2118" stroke-width="1.2" />
  <rect x="190" y="32" width="22" height="20" rx="3" fill="#F8F4EA" stroke="#2B2118" stroke-width="1.2" />
  <rect x="280" y="32" width="22" height="20" rx="3" fill="#F8F4EA" stroke="#2B2118" stroke-width="1.2" />
  <!-- Facade Windows Matrix -->
  <g fill="#2B2118">
    <!-- Top floor -->
    <rect x="80" y="80" width="24" height="30" rx="2" />
    <rect x="140" y="80" width="24" height="30" rx="2" />
    <rect x="200" y="80" width="24" height="30" rx="2" />
    <rect x="260" y="80" width="24" height="30" rx="2" />
    <rect x="320" y="80" width="24" height="30" rx="2" />
    <!-- Mid floor with balconies -->
    <rect x="80" y="130" width="24" height="34" rx="2" />
    <rect x="140" y="130" width="24" height="34" rx="2" />
    <rect x="200" y="130" width="24" height="34" rx="2" />
    <rect x="260" y="130" width="24" height="34" rx="2" />
    <rect x="320" y="130" width="24" height="34" rx="2" />
  </g>
  <!-- Balcony railings -->
  <line x1="75" y1="164" x2="110" y2="164" stroke="#8E4526" stroke-width="2.5" />
  <line x1="135" y1="164" x2="170" y2="164" stroke="#8E4526" stroke-width="2.5" />
  <line x1="195" y1="164" x2="230" y2="164" stroke="#8E4526" stroke-width="2.5" />
  <line x1="255" y1="164" x2="290" y2="164" stroke="#8E4526" stroke-width="2.5" />
  <line x1="315" y1="164" x2="350" y2="164" stroke="#8E4526" stroke-width="2.5" />
  <!-- Grand Arched Entrance & Canopy -->
  <path d="M 180 240 L 180 195 A 20 20 0 0 1 220 195 L 220 240 Z" fill="#2B2118" />
  <polygon points="160,195 240,195 235,185 165,185" fill="#B9643A" stroke="#2B2118" stroke-width="1.2" />
  <!-- Potted Topiary Plants -->
  <ellipse cx="60" cy="225" rx="14" ry="16" fill="#5E6045" stroke="#2B2118" stroke-width="1.2" />
  <ellipse cx="340" cy="225" rx="14" ry="16" fill="#5E6045" stroke="#2B2118" stroke-width="1.2" />
</svg>
