<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none" id="airplane-window-svg">
  <defs>
    <clipPath id="window-inner-clip">
      <!-- Oval Airplane Window Aperture -->
      <rect x="120" y="100" width="360" height="600" rx="180" ry="180" />
    </clipPath>
    <linearGradient id="window-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8BB0C8" />
      <stop offset="45%" stop-color="#C2D8E4" />
      <stop offset="70%" stop-color="#EED8C0" />
      <stop offset="100%" stop-color="#D9A877" />
    </linearGradient>
  </defs>

  <!-- Outer Window Frame Bezel (Cream Paper / Aircraft Wall) -->
  <rect x="50" y="30" width="500" height="740" rx="220" ry="220" fill="#F3EBDB" stroke="#2B2118" stroke-width="3" />
  <!-- Inner Recessed Bezel -->
  <rect x="90" y="70" width="420" height="660" rx="195" ry="195" fill="#E8DEC8" stroke="#2B2118" stroke-width="2" />

  <!-- Window Content (Clipped to Oval) -->
  <g clip-path="url(#window-inner-clip)">
    <!-- Sky Background -->
    <rect x="100" y="80" width="400" height="640" fill="url(#window-sky)" />

    <!-- Distant Sea of Fluffy Clouds -->
    <g id="drifting-clouds-window" fill="#FAF6EE" opacity="0.95">
      <!-- Cloud Bank 1 (Lower) -->
      <path d="M 80 540 C 140 480, 240 500, 300 520 C 360 490, 440 510, 520 540 L 520 720 L 80 720 Z" />
      <!-- Cloud Bank 2 (Higher, Softer) -->
      <path d="M 100 480 C 160 430, 280 440, 340 460 C 420 420, 480 450, 520 480 L 520 540 L 100 540 Z" fill="#F5EFE0" opacity="0.75" />
    </g>

    <!-- Cloud Hatch Lines -->
    <g stroke="#2B2118" stroke-width="1.2" stroke-linecap="round" opacity="0.25">
      <path d="M 160 510 C 200 500, 260 515, 300 525" />
      <path d="M 330 505 C 380 495, 430 505, 470 520" />
      <path d="M 210 545 C 270 540, 330 550, 390 560" />
    </g>

    <!-- Airplane Wing (Extending from Left to Right Edge) -->
    <g id="airplane-wing">
      <!-- Main Wing Surface -->
      <polygon points="100,320 440,430 430,470 100,430" fill="#FAF6EE" stroke="#2B2118" stroke-width="2.5" />
      <!-- Wing Shaded Underside / Flap Line -->
      <polygon points="100,430 430,470 420,490 100,460" fill="#E2D7C2" stroke="#2B2118" stroke-width="2" />
      <!-- Terracotta Wingtip Winglet (Upright) -->
      <polygon points="420,410 460,370 470,375 440,435" fill="#B9643A" stroke="#2B2118" stroke-width="2" />
      <!-- Jet Engine Nacelle (Cylindrical pod below wing) -->
      <ellipse cx="280" cy="460" rx="42" ry="24" fill="#E8DFCD" stroke="#2B2118" stroke-width="2" />
      <ellipse cx="250" cy="460" rx="12" ry="20" fill="#2B2118" />
      <ellipse cx="252" cy="460" rx="6" ry="14" fill="#5E6045" />
      <!-- Wing Panel Seam Lines -->
      <line x1="200" y1="352" x2="195" y2="435" stroke="#2B2118" stroke-width="1.2" opacity="0.5" />
      <line x1="320" y1="392" x2="315" y2="455" stroke="#2B2118" stroke-width="1.2" opacity="0.5" />
    </g>

    <!-- Glass Reflection Highlight (Diagonal Sheen) -->
    <path d="M 120 180 L 400 680 L 440 680 L 160 180 Z" fill="#FFFFFF" opacity="0.18" />
    <path d="M 180 180 L 460 680 L 475 680 L 195 180 Z" fill="#FFFFFF" opacity="0.12" />
  </g>

  <!-- Frame Screws / Rivets Details around Window Rim -->
  <g fill="#A89E88" opacity="0.7">
    <circle cx="160" cy="90" r="4" />
    <circle cx="230" cy="65" r="4" />
    <circle cx="300" cy="55" r="4" />
    <circle cx="370" cy="65" r="4" />
    <circle cx="440" cy="90" r="4" />
    <circle cx="490" cy="180" r="4" />
    <circle cx="510" cy="280" r="4" />
    <circle cx="515" cy="400" r="4" />
    <circle cx="510" cy="520" r="4" />
    <circle cx="490" cy="620" r="4" />
    <circle cx="440" cy="710" r="4" />
    <circle cx="370" cy="735" r="4" />
    <circle cx="300" cy="745" r="4" />
    <circle cx="230" cy="735" r="4" />
    <circle cx="160" cy="710" r="4" />
    <circle cx="110" cy="620" r="4" />
    <circle cx="90" cy="520" r="4" />
    <circle cx="85" cy="400" r="4" />
    <circle cx="90" cy="280" r="4" />
    <circle cx="110" cy="180" r="4" />
  </g>
</svg>
