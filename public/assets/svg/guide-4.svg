<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- guide-4: The Pantheon -->
  <rect width="120" height="120" rx="16" fill="#F8F3EA" />
  <!-- Rotunda Dome Behind -->
  <ellipse cx="60" cy="52" rx="36" ry="24" fill="#B9643A" stroke="#2B2118" stroke-width="1.4" />
  <!-- Oculus Highlight -->
  <ellipse cx="60" cy="34" rx="7" ry="3" fill="#FAF6EE" stroke="#2B2118" stroke-width="1.2" />
  <!-- Portico Triangular Pediment -->
  <polygon points="20,54 60,32 100,54" fill="#F3EBDB" stroke="#2B2118" stroke-width="1.6" />
  <!-- Inscription band -->
  <rect x="22" y="54" width="76" height="8" fill="#E8DFCD" stroke="#2B2118" stroke-width="1.2" />
  <!-- 8 Corinthian Granite Columns -->
  <g fill="#FAF6EE" stroke="#2B2118" stroke-width="1.2">
    <rect x="26" y="62" width="6" height="34" />
    <rect x="36" y="62" width="6" height="34" />
    <rect x="46" y="62" width="6" height="34" />
    <rect x="57" y="62" width="6" height="34" />
    <rect x="68" y="62" width="6" height="34" />
    <rect x="78" y="62" width="6" height="34" />
    <rect x="88" y="62" width="6" height="34" />
  </g>
  <!-- Podium Steps -->
  <polygon points="14,102 106,102 100,96 20,96" fill="#D9A877" stroke="#2B2118" stroke-width="1.2" />
</svg>
