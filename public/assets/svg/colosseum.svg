      <line x1="531" y1="738" x2="531" y2="942" stroke-width="1.4" opacity="0.6" />
      <line x1="571" y1="735" x2="571" y2="940" stroke-width="1.4" opacity="0.6" />
      <line x1="611" y1="735" x2="611" y2="940" stroke-width="1.4" opacity="0.6" />
      <line x1="651" y1="738" x2="651" y2="942" stroke-width="1.4" opacity="0.6" />
      <line x1="691" y1="745" x2="691" y2="946" stroke-width="1.4" opacity="0.6" />
      <line x1="728" y1="755" x2="728" y2="952" stroke-width="1.4" opacity="0.6" />
      <line x1="762" y1="768" x2="762" y2="958" stroke-width="1.4" opacity="0.6" />
