    <path d="M 435 870 Q 640 855 840 910" stroke="#F3EBDB" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <path d="M 435 870 Q 640 855 840 910" stroke="#2B2118" stroke-width="1.8" stroke-linecap="round" />

