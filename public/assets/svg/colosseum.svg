<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none" id="colosseum" data-depth="0.80">
  <defs>
    <pattern id="colo-hatch" width="8" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
