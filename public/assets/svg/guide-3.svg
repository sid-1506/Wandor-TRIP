<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- guide-3: St. Peter's Dome -->
  <rect width="120" height="120" rx="16" fill="#F8F3EA" />
  <!-- Drum Base -->
  <rect x="34" y="60" width="52" height="24" fill="#F3EBDB" stroke="#2B2118" stroke-width="1.4" />
  <!-- Drum Columns -->
  <line x1="42" y1="60" x2="42" y2="84" stroke="#2B2118" stroke-width="1.2" />
  <line x1="51" y1="60" x2="51" y2="84" stroke="#2B2118" stroke-width="1.2" />
  <line x1="60" y1="60" x2="60" y2="84" stroke="#2B2118" stroke-width="1.2" />
  <line x1="69" y1="60" x2="69" y2="84" stroke="#2B2118" stroke-width="1.2" />
  <line x1="78" y1="60" x2="78" y2="84" stroke="#2B2118" stroke-width="1.2" />
  <!-- Great Renaissance Dome -->
  <path d="M 32 60 C 32 32, 45 22, 60 22 C 75 22, 88 32, 88 60 Z" fill="#8B8D69" stroke="#2B2118" stroke-width="1.6" />
  <!-- Dome Shading -->
  <path d="M 60 22 C 75 22, 88 32, 88 60 L 60 60 Z" fill="#5E6045" opacity="0.4" />
  <!-- Lantern & Cross -->
  <rect x="55" y="14" width="10" height="9" fill="#FAF6EE" stroke="#2B2118" stroke-width="1.2" />
  <line x1="60" y1="14" x2="60" y2="6" stroke="#2B2118" stroke-width="1.5" />
  <line x1="57" y1="9" x2="63" y2="9" stroke="#2B2118" stroke-width="1.3" />
  <!-- Basilica Roof Line -->
  <polygon points="15,96 105,96 90,84 30,84" fill="#B9643A" stroke="#2B2118" stroke-width="1.4" />
</svg>
