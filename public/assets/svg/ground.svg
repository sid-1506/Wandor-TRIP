<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none" id="ground" data-depth="0.95">
  <defs>
    <pattern id="ground-hatch-terracotta" width="10" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#2B2118" stroke-width="1" opacity="0.3" />
    </pattern>
    <pattern id="ground-hatch-cream" width="12" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#F3EBDB" stroke-width="1.3" opacity="0.45" />
    </pattern>
  </defs>

  <g id="ground-terrain">
    <!-- Base Layer (Terracotta Deep Slope) -->
    <path d="M 0 940 
             C 120 930, 260 910, 420 920 
             C 580 930, 720 950, 880 940 
             C 1040 930, 1180 890, 1340 890 
             C 1480 890, 1620 860, 1780 870 
             C 1850 875, 1900 885, 1920 890 
             L 1920 1080 L 0 1080 Z" 
          fill="#B9643A" />

    <!-- Foreground Sand Ridge Layer (Center & Right Slope) -->
    <path d="M 380 1080 
             C 520 980, 680 960, 840 965 
             C 1000 970, 1150 940, 1300 920 
             C 1460 900, 1620 870, 1760 880 
             C 1840 885, 1890 905, 1920 920 
             L 1920 1080 Z" 
          fill="#D9A877" />

    <!-- Foreground Darker Terracotta Roll (Lower Midground) -->
    <path d="M 0 1020 
             C 180 980, 360 970, 540 990 
             C 700 1010, 860 1030, 1020 1010 
             C 1180 990, 1360 980, 1540 1000 
             C 1680 1015, 1820 1040, 1920 1060 
             L 1920 1080 L 0 1080 Z" 
          fill="#9C4B25" />

    <!-- Sage Green Meadow Edge on Far Right -->
    <path d="M 1660 1080 
             C 1720 980, 1790 910, 1870 890 
             C 1895 885, 1910 885, 1920 890 
             L 1920 1080 Z" 
          fill="#A9AB8C" />
    <path d="M 1720 1080 C 1770 1000, 1840 940, 1920 930 L 1920 1080 Z" fill="#8B8D69" opacity="0.6" />

    <!-- Patterns on Ground Layers -->
    <path d="M 0 940 C 420 920, 880 940, 1340 890 C 1620 860, 1920 890, 1920 1080 L 0 1080 Z" fill="url(#ground-hatch-terracotta)" />
    <path d="M 380 1080 C 680 960, 1000 970, 1300 920 C 1620 870, 1920 920, 1920 1080 Z" fill="url(#ground-hatch-cream)" />

    <!-- Winding Staircase Path Up the Right Hill -->
    <g id="stairway-path">
      <!-- Steps Leading Upward toward Taj & Christ -->
      <polygon points="1280,1080 1340,1080 1480,950 1450,950" fill="#E8DEC8" stroke="#2B2118" stroke-width="1.4" />
      <polygon points="1450,950 1480,950 1560,900 1540,900" fill="#E8DEC8" stroke="#2B2118" stroke-width="1.4" />
      
      <!-- Stepped Horizontal Slabs along Path -->
      <g stroke="#2B2118" stroke-width="1.3" stroke-linecap="round">
        <line x1="1295" y1="1065" x2="1355" y2="1065" />
        <line x1="1315" y1="1050" x2="1375" y2="1050" />
        <line x1="1335" y1="1035" x2="1395" y2="1035" />
        <line x1="1355" y1="1020" x2="1415" y2="1020" />
        <line x1="1375" y1="1005" x2="1435" y2="1005" />
        <line x1="1395" y1="990" x2="1455" y2="990" />
        <line x1="1415" y1="975" x2="1470" y2="975" />
        <line x1="1435" y1="960" x2="1485" y2="960" />
        <line x1="1465" y1="945" x2="1510" y2="945" />
        <line x1="1490" y1="930" x2="1530" y2="930" />
        <line x1="1515" y1="915" x2="1550" y2="915" />
      </g>
    </g>

    <!-- Hand-Drawn Contour Lines & Hatching -->
    <g stroke="#2B2118" stroke-width="1.6" stroke-linecap="round" fill="none">
      <!-- Main Ridge Crests -->
      <path d="M 0 940 C 140 930, 280 915, 420 920 C 580 930, 720 950, 880 940 C 1040 930, 1180 890, 1340 890 C 1480 890, 1620 860, 1780 870 C 1850 875, 1900 885, 1920 890" />
      <path d="M 380 1080 C 520 980, 680 960, 840 965 C 1000 970, 1150 940, 1300 920 C 1460 900, 1620 870, 1760 880" stroke-dasharray="8 4" opacity="0.6" />
      <path d="M 0 1020 C 180 980, 360 970, 540 990 C 700 1010, 860 1030, 1020 1010 C 1180 990, 1360 980, 1540 1000" stroke-width="1.3" opacity="0.4" />
      
      <!-- Ground Hatch Dashes (Stippled Look) -->
      <!-- Left Ground -->
      <line x1="220" y1="960" x2="250" y2="955" opacity="0.5" />
      <line x1="280" y1="975" x2="310" y2="970" opacity="0.5" />
      <line x1="340" y1="965" x2="370" y2="960" opacity="0.5" />
      <!-- Center Ground -->
      <line x1="620" y1="980" x2="650" y2="978" opacity="0.5" />
      <line x1="690" y1="995" x2="720" y2="992" opacity="0.5" />
      <line x1="760" y1="985" x2="790" y2="982" opacity="0.5" />
      <line x1="830" y1="1000" x2="860" y2="996" opacity="0.5" />
      <line x1="910" y1="990" x2="940" y2="986" opacity="0.5" />
      <line x1="980" y1="1005" x2="1010" y2="1000" opacity="0.5" />
      <!-- Right Hill -->
      <line x1="1140" y1="950" x2="1170" y2="946" opacity="0.5" />
      <line x1="1210" y1="965" x2="1240" y2="960" opacity="0.5" />
      <line x1="1580" y1="930" x2="1610" y2="926" opacity="0.5" />
      <line x1="1640" y1="945" x2="1670" y2="940" opacity="0.5" />
    </g>

    <!-- Delicate Cream Grass Highlights -->
    <g stroke="#FAF6EE" stroke-width="1.5" stroke-linecap="round" opacity="0.75">
      <path d="M 640 962 L 644 954 M 646 962 L 652 952" />
      <path d="M 850 965 L 854 956 M 856 965 L 862 955" />
      <path d="M 1120 922 L 1124 912 M 1126 922 L 1132 910" />
      <path d="M 1640 882 L 1644 872 M 1646 882 L 1652 870" />
      <path d="M 1830 892 L 1834 882 M 1836 892 L 1842 880" />
    </g>
  </g>
</svg>
