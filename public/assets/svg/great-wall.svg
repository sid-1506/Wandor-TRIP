<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none" id="great-wall" data-depth="0.75">
  <defs>
    <pattern id="brick-pattern" width="16" height="8" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 16 0 M 0 8 L 16 8 M 8 0 L 8 8 M 0 4 L 16 4 M 0 0 L 0 4 M 16 0 L 16 4" stroke="#2B2118" stroke-width="0.7" opacity="0.3" fill="none" />
    </pattern>
    <pattern id="wall-hatch" width="6" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#2B2118" stroke-width="0.9" opacity="0.25" />
    </pattern>
  </defs>

  <!-- Terracotta Cliff Buttress Base -->
  <path d="M 20 980 
           L 40 820 
           L 70 680 
           L 110 570 
           L 220 570 
           L 250 640 
           L 320 720 
           L 380 770 
           L 440 850 
           L 420 980 
           L 20 980 Z" 
        fill="#B9643A" />

  <!-- Shaded Terracotta Facets on Cliff -->
  <path d="M 20 980 L 40 820 L 70 680 L 110 570 L 150 570 L 140 760 L 160 850 L 120 980 Z" fill="#9C4B25" />
  <path d="M 220 570 L 250 640 L 320 720 L 300 780 L 260 740 L 210 650 Z" fill="#843B1B" />
  <path d="M 320 720 L 380 770 L 440 850 L 390 890 L 340 820 Z" fill="#A8572F" />

  <!-- Hatch Texture Overlays -->
  <path d="M 40 820 L 70 680 L 110 570 L 220 570 L 250 640 L 320 720 L 440 850 L 420 980 L 20 980 Z" fill="url(#wall-hatch)" />

  <!-- Top Watchtower (Crenellated Fortress) -->
  <!-- Main Tower Body -->
  <rect x="75" y="580" width="135" height="110" fill="#B9643A" />
  <rect x="75" y="580" width="45" height="110" fill="#8E4526" />
  <!-- Battlements / Merlons on Top -->
  <path d="M 70 580 
           L 70 555 L 86 555 L 86 565 L 100 565 L 100 555 L 116 555 L 116 565 
           L 130 565 L 130 555 L 146 555 L 146 565 L 160 565 L 160 555 L 176 555 
           L 176 565 L 190 565 L 190 555 L 206 555 L 206 565 L 216 565 L 216 580 Z" 
        fill="#A6542D" stroke="#2B2118" stroke-width="1.8" stroke-linejoin="round" />

  <!-- Arched Slit Windows on Watchtower -->
  <!-- Top Tier Windows -->
  <path d="M 90 600 L 90 618 A 6 6 0 0 1 102 618 L 102 600 Z" fill="#2B2118" />
  <path d="M 120 600 L 120 618 A 6 6 0 0 1 132 618 L 132 600 Z" fill="#2B2118" />
  <path d="M 150 600 L 150 618 A 6 6 0 0 1 162 618 L 162 600 Z" fill="#2B2118" />
  <path d="M 180 600 L 180 618 A 6 6 0 0 1 192 618 L 192 600 Z" fill="#2B2118" />

  <!-- Mid-Tier Windows -->
  <path d="M 90 635 L 90 655 A 6 6 0 0 1 102 655 L 102 635 Z" fill="#2B2118" />
  <path d="M 120 635 L 120 655 A 6 6 0 0 1 132 655 L 132 635 Z" fill="#2B2118" />
  <path d="M 150 635 L 150 655 A 6 6 0 0 1 162 655 L 162 635 Z" fill="#2B2118" />
  <path d="M 180 635 L 180 655 A 6 6 0 0 1 192 655 L 192 635 Z" fill="#2B2118" />

  <!-- Stepped Ramparts Descending Rightward -->
  <!-- Section 1 -->
  <path d="M 210 630 L 285 675 L 285 715 L 210 670 Z" fill="#A8572F" stroke="#2B2118" stroke-width="1.5" />
  <!-- Merlons on Rampart -->
  <path d="M 215 628 L 225 634 L 225 640 L 235 646 L 235 640 L 245 646 L 245 652 L 255 658 L 255 652 L 265 658 L 265 664 L 275 670 L 285 675" stroke="#2B2118" stroke-width="2" fill="none" />
  <!-- Section 2 -->
  <path d="M 285 695 L 365 745 L 365 785 L 285 735 Z" fill="#9C4B25" stroke="#2B2118" stroke-width="1.5" />
  <path d="M 285 695 L 298 703 L 298 710 L 312 718 L 312 711 L 326 720 L 326 727 L 340 735 L 340 728 L 354 737 L 365 745" stroke="#2B2118" stroke-width="2" fill="none" />
  <!-- Section 3 -->
  <path d="M 365 765 L 435 815 L 435 865 L 365 815 Z" fill="#843B1B" stroke="#2B2118" stroke-width="1.5" />

  <!-- Lower Gatehouse Pavilion / Ruin at the Base -->
  <g id="gatehouse-ruin" transform="translate(60, 720)">
    <!-- Classical Cornice & Pediment -->
    <polygon points="40,20 160,20 170,35 30,35" fill="#D9A877" stroke="#2B2118" stroke-width="1.6" />
    <polygon points="50,10 150,10 160,20 40,20" fill="#F3EBDB" stroke="#2B2118" stroke-width="1.6" />
    <rect x="35" y="35" width="130" height="150" fill="#B9643A" stroke="#2B2118" stroke-width="1.8" />
    
    <!-- Cream Pilaster Strips on Gatehouse -->
    <rect x="42" y="35" width="14" height="150" fill="#F3EBDB" opacity="0.85" stroke="#2B2118" stroke-width="1.2" />
    <rect x="144" y="35" width="14" height="150" fill="#F3EBDB" opacity="0.85" stroke="#2B2118" stroke-width="1.2" />
    <rect x="80" y="35" width="8" height="60" fill="#F3EBDB" opacity="0.7" />
    <rect x="112" y="35" width="8" height="60" fill="#F3EBDB" opacity="0.7" />

    <!-- Grand Arched Portal -->
    <path d="M 72 185 
             L 72 110 
             A 28 28 0 0 1 128 110 
             L 128 185 Z" 
          fill="#1E1610" stroke="#2B2118" stroke-width="2" />
    
    <!-- Inner Portal Arch Keystone & Details in Cream -->
    <path d="M 68 110 A 32 32 0 0 1 132 110" stroke="#F3EBDB" stroke-width="2.5" fill="none" opacity="0.9" />
    <rect x="96" y="74" width="8" height="10" fill="#F3EBDB" stroke="#2B2118" stroke-width="1.2" />
    
    <!-- Stone Joint Lines -->
    <line x1="35" y1="65" x2="165" y2="65" stroke="#2B2118" stroke-width="1.2" opacity="0.6" />
    <line x1="35" y1="95" x2="72" y2="95" stroke="#2B2118" stroke-width="1.2" opacity="0.6" />
    <line x1="128" y1="95" x2="165" y2="95" stroke="#2B2118" stroke-width="1.2" opacity="0.6" />
    <line x1="35" y1="130" x2="72" y2="130" stroke="#2B2118" stroke-width="1.2" opacity="0.6" />
    <line x1="128" y1="130" x2="165" y2="130" stroke="#2B2118" stroke-width="1.2" opacity="0.6" />
    <line x1="35" y1="160" x2="72" y2="160" stroke="#2B2118" stroke-width="1.2" opacity="0.6" />
    <line x1="128" y1="160" x2="165" y2="160" stroke="#2B2118" stroke-width="1.2" opacity="0.6" />
  </g>

  <!-- Architectural Outlines & Hand-Drawn Texture on Cliff -->
  <g stroke="#2B2118" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Outer Silhouette -->
    <path d="M 75 580 L 75 690 L 60 720 L 60 980" />
    <path d="M 210 580 L 210 630 L 285 675 L 365 745 L 435 815 L 435 980" />
    <!-- Diagonal Stratum Rock Fissures -->
    <path d="M 120 710 L 70 820 L 50 950" stroke-width="1.5" />
    <path d="M 210 690 L 170 800 L 150 920" stroke-width="1.5" />
    <path d="M 270 750 L 240 850 L 230 960" stroke-width="1.5" />
    <path d="M 350 810 L 320 900 L 310 980" stroke-width="1.5" />
  </g>

  <!-- Cream Masonry Highlights -->
  <g stroke="#F3EBDB" stroke-width="1.5" stroke-linecap="round" opacity="0.75">
    <line x1="85" y1="570" x2="140" y2="570" />
    <line x1="150" y1="570" x2="205" y2="570" />
    <line x1="220" y1="620" x2="275" y2="655" />
    <line x1="295" y1="685" x2="355" y2="725" />
    <line x1="375" y1="755" x2="425" y2="795" />
  </g>
</svg>
