<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="sky-tuscany" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCF9F3" />
      <stop offset="100%" stop-color="#EFE4CF" />
    </linearGradient>
    <pattern id="vineyard-lines" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <line x1="0" y1="0" x2="12" y2="0" stroke="#5E6045" stroke-width="1.2" opacity="0.35" />
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#sky-tuscany)" rx="24" />

  <!-- Distant Blue-Sage Tuscan Hills -->
  <path d="M 0 310 C 200 270, 420 280, 600 290 C 700 295, 760 300, 800 305 L 800 600 L 0 600 Z" fill="#B4BAA0" opacity="0.65" />
  <path d="M 0 350 C 180 320, 360 340, 540 330 C 680 320, 750 340, 800 360 L 800 600 L 0 600 Z" fill="#9DA384" opacity="0.8" />

  <!-- Rolling Terracotta & Golden Sand Hill (Midground) -->
  <path d="M 0 400 C 220 370, 440 380, 640 430 C 720 450, 770 470, 800 480 L 800 600 L 0 600 Z" fill="#D9A877" />
  
  <!-- Vineyard Pattern Area -->
  <path d="M 0 460 C 220 420, 460 440, 680 500 L 680 600 L 0 600 Z" fill="#C59B6C" />
  <path d="M 0 460 C 220 420, 460 440, 680 500 L 680 600 L 0 600 Z" fill="url(#vineyard-lines)" />

  <!-- Foreground Olive Hill -->
  <path d="M 280 600 C 440 500, 600 480, 800 510 L 800 600 Z" fill="#8B8D69" />

  <!-- Tuscan Villa on Hilltop -->
  <g transform="translate(420, 310)">
    <!-- Main Villa Building -->
    <rect x="30" y="25" width="65" height="45" fill="#F3EBDB" stroke="#2B2118" stroke-width="1.4" />
    <polygon points="25,25 62,8 100,25" fill="#B9643A" stroke="#2B2118" stroke-width="1.4" />
    <!-- Tower / Belvedere -->
    <rect x="75" y="5" width="22" height="65" fill="#E8DFCD" stroke="#2B2118" stroke-width="1.4" />
    <polygon points="72,5 86,-8 100,5" fill="#8E4526" stroke="#2B2118" stroke-width="1.4" />
    <!-- Arched Windows & Doors -->
    <rect x="80" y="14" width="8" height="12" rx="4" fill="#2B2118" />
    <rect x="42" y="38" width="8" height="12" fill="#2B2118" />
    <rect x="58" y="38" width="8" height="12" fill="#2B2118" />
    <rect x="48" y="54" width="12" height="16" fill="#2B2118" />
  </g>

  <!-- Cypress Lined Hillside Drive -->
  <g id="tuscany-cypresses">
    <!-- Tree 1 -->
    <path d="M 380 400 C 374 365, 374 340, 380 320 C 386 340, 386 365, 380 400 Z" fill="#5E6045" stroke="#2B2118" stroke-width="1.2" />
    <!-- Tree 2 -->
    <path d="M 400 405 C 394 375, 394 350, 400 330 C 406 350, 406 375, 400 405 Z" fill="#4E5136" stroke="#2B2118" stroke-width="1.2" />
    <!-- Tree 3 -->
    <path d="M 525 390 C 520 365, 520 345, 525 330 C 530 345, 530 365, 525 390 Z" fill="#5E6045" stroke="#2B2118" stroke-width="1.2" />
    <!-- Tree 4 -->
    <path d="M 545 400 C 539 370, 539 350, 545 335 C 551 350, 551 370, 545 400 Z" fill="#757954" stroke="#2B2118" stroke-width="1.2" />
    <!-- Tree 5 (Foreground larger) -->
    <path d="M 640 540 C 630 480, 630 430, 640 390 C 650 430, 650 480, 640 540 Z" fill="#4B4E34" stroke="#2B2118" stroke-width="1.5" />
    <path d="M 670 560 C 662 505, 662 460, 670 420 C 678 460, 678 505, 670 560 Z" fill="#5E6045" stroke="#2B2118" stroke-width="1.5" />
  </g>
</svg>
