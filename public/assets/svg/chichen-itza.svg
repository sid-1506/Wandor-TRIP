<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none" id="chichen-itza" data-depth="0.80">
  <defs>
    <pattern id="pyramid-hatch" width="6" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#2B2118" stroke-width="0.7" opacity="0.3" />
    </pattern>
  </defs>

  <g id="chichen-itza-group">
    <!-- Stepped Pyramid Silhouette -->
    <!-- Base Pyramid Body (Left / Light Face) -->
    <polygon points="790,960 885,770 935,770 935,960" fill="#F3EBDB" />
    
    <!-- Base Pyramid Body (Right / Shaded Face) -->
    <polygon points="935,770 975,770 1060,960 935,960" fill="#D2C5A9" />

    <!-- Stepped Tier Levels (Left Light Side) -->
    <!-- Tier 1 (Bottom) to Tier 9 (Top) -->
    <g fill="#F3EBDB" stroke="#2B2118" stroke-width="1.3">
      <!-- Tier 1 -->
      <polygon points="790,960 802,938 935,938 935,960" />
      <!-- Tier 2 -->
      <polygon points="804,938 816,916 935,916 935,938" />
      <!-- Tier 3 -->
      <polygon points="818,916 829,894 935,894 935,916" />
      <!-- Tier 4 -->
      <polygon points="831,894 842,872 935,872 935,894" />
      <!-- Tier 5 -->
      <polygon points="844,872 854,850 935,850 935,872" />
      <!-- Tier 6 -->
      <polygon points="856,850 866,828 935,828 935,850" />
      <!-- Tier 7 -->
      <polygon points="868,828 877,806 935,806 935,828" />
      <!-- Tier 8 -->
      <polygon points="879,806 887,785 935,785 935,806" />
      <!-- Tier 9 -->
      <polygon points="889,785 897,768 935,768 935,785" />
    </g>

    <!-- Stepped Tier Levels (Right Shaded Side) -->
    <g fill="#C4B698" stroke="#2B2118" stroke-width="1.3">
      <!-- Tier 1 -->
      <polygon points="935,960 935,938 1046,938 1060,960" />
      <!-- Tier 2 -->
      <polygon points="935,938 935,916 1032,916 1044,938" />
      <!-- Tier 3 -->
      <polygon points="935,916 935,894 1018,894 1030,916" />
      <!-- Tier 4 -->
      <polygon points="935,894 935,872 1005,872 1016,894" />
      <!-- Tier 5 -->
      <polygon points="935,872 935,850 992,850 1003,872" />
      <!-- Tier 6 -->
      <polygon points="935,850 935,828 980,828 990,850" />
      <!-- Tier 7 -->
      <polygon points="935,828 935,806 968,806 978,828" />
      <!-- Tier 8 -->
      <polygon points="935,806 935,785 957,785 966,806" />
      <!-- Tier 9 -->
      <polygon points="935,785 935,768 948,768 955,785" />
    </g>

    <!-- Shading Hatch Texture Overlay -->
    <polygon points="935,770 975,770 1060,960 935,960" fill="url(#pyramid-hatch)" />

    <!-- Grand Axial Central Staircase -->
    <g id="central-staircase">
      <!-- Staircase Base Ramp Profile -->
      <polygon points="898,960 918,768 946,768 954,960" fill="#E8DFCE" stroke="#2B2118" stroke-width="1.5" />
      
      <!-- Stepped Balustrades (Ramps) -->
      <polygon points="898,960 904,960 922,768 918,768" fill="#F8F3EA" stroke="#2B2118" stroke-width="1.3" />
      <polygon points="946,768 950,768 958,960 954,960" fill="#B9AA8B" stroke="#2B2118" stroke-width="1.3" />

      <!-- Horizontal Steps Line Art -->
      <g stroke="#2B2118" stroke-width="1.1" stroke-linecap="round">
        <line x1="903" y1="952" x2="953" y2="952" />
        <line x1="905" y1="942" x2="952" y2="942" />
        <line x1="907" y1="932" x2="951" y2="932" />
        <line x1="909" y1="922" x2="950" y2="922" />
        <line x1="911" y1="912" x2="949" y2="912" />
        <line x1="913" y1="902" x2="948" y2="902" />
        <line x1="915" y1="892" x2="947" y2="892" />
        <line x1="917" y1="882" x2="946" y2="882" />
        <line x1="919" y1="872" x2="945" y2="872" />
        <line x1="920" y1="862" x2="945" y2="862" />
        <line x1="921" y1="852" x2="944" y2="852" />
        <line x1="922" y1="842" x2="943" y2="842" />
        <line x1="923" y1="832" x2="943" y2="832" />
        <line x1="924" y1="822" x2="942" y2="822" />
        <line x1="925" y1="812" x2="942" y2="812" />
        <line x1="926" y1="802" x2="941" y2="802" />
        <line x1="927" y1="792" x2="941" y2="792" />
        <line x1="928" y1="782" x2="940" y2="782" />
        <line x1="929" y1="772" x2="940" y2="772" />
      </g>
    </g>

    <!-- Top Temple Sanctuary -->
    <g id="top-temple">
      <!-- Temple Platform -->
      <polygon points="902,768 958,768 956,762 904,762" fill="#F8F3EA" stroke="#2B2118" stroke-width="1.3" />
      <!-- Temple Walls -->
      <rect x="912" y="736" width="38" height="26" fill="#F3EBDB" stroke="#2B2118" stroke-width="1.5" />
      <!-- Temple Cornice / Roof -->
      <polygon points="908,736 954,736 951,728 911,728" fill="#E8DFCE" stroke="#2B2118" stroke-width="1.5" />
      <!-- Temple Doorway (Dark Entry) -->
      <rect x="924" y="744" width="14" height="18" fill="#1C140E" stroke="#2B2118" stroke-width="1.3" />
    </g>

    <!-- Overall Crisp Linework Profile -->
    <path d="M 790 960 L 897 768 L 908 736 L 911 728 L 951 728 L 954 736 L 958 768 L 1060 960" stroke="#2B2118" stroke-width="2" fill="none" stroke-linejoin="round" />
  </g>
</svg>
