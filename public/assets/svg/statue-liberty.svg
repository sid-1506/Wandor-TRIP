<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 260" fill="none">
  <!-- Statue of Liberty Sticker -->
  <g filter="drop-shadow(0px 8px 16px rgba(43,33,24,0.18))">
    <!-- White Sticker Backing -->
    <path d="M 25 250 L 40 180 L 45 100 L 70 40 L 105 10 L 115 15 L 105 60 L 115 100 L 120 180 L 135 250 Z" 
          stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" fill="#FFFFFF" />

    <!-- Granite Pedestal -->
    <polygon points="35,250 125,250 120,185 40,185" fill="#D9A877" stroke="#2B2118" stroke-width="1.8" />
    <rect x="45" y="195" width="70" height="45" fill="#F3EBDB" stroke="#2B2118" stroke-width="1.4" />

    <!-- Lady Liberty in Patinated Sage Green / Copper Verdigris (#A9AB8C / #8B8D69) -->
    <!-- Draped Robes -->
    <path d="M 48 185 L 54 90 L 106 90 L 112 185 Z" fill="#8B8D69" stroke="#2B2118" stroke-width="1.8" />
    <path d="M 80 90 L 80 185 L 112 185 L 106 90 Z" fill="#6A7050" />

    <!-- Vertical Fabric Folds -->
    <line x1="62" y1="95" x2="60" y2="185" stroke="#2B2118" stroke-width="1.2" opacity="0.6" />
    <line x1="72" y1="92" x2="70" y2="185" stroke="#2B2118" stroke-width="1.2" opacity="0.6" />
    <line x1="90" y1="92" x2="94" y2="185" stroke="#2B2118" stroke-width="1.2" opacity="0.6" />
    <line x1="100" y1="95" x2="105" y2="185" stroke="#2B2118" stroke-width="1.2" opacity="0.6" />

    <!-- Left Arm Holding Tabula Ansata (July 4, 1776 tablet) -->
    <polygon points="46,110 60,105 62,125 48,130" fill="#FAF6EE" stroke="#2B2118" stroke-width="1.3" />

    <!-- Crown & Head -->
    <ellipse cx="80" cy="68" rx="10" ry="12" fill="#FAF6EE" stroke="#2B2118" stroke-width="1.4" />
    <!-- 7 Ray Spikes of the Crown -->
    <polygon points="70,62 60,50 72,58" fill="#8B8D69" stroke="#2B2118" stroke-width="1" />
    <polygon points="74,58 70,44 78,56" fill="#8B8D69" stroke="#2B2118" stroke-width="1" />
    <polygon points="78,56 80,40 82,56" fill="#8B8D69" stroke="#2B2118" stroke-width="1" />
    <polygon points="82,56 90,44 86,58" fill="#8B8D69" stroke="#2B2118" stroke-width="1" />
    <polygon points="88,58 100,50 90,62" fill="#8B8D69" stroke="#2B2118" stroke-width="1" />

    <!-- Right Arm Raised High Holding the Torch -->
    <path d="M 94 85 L 105 32 L 112 34 L 104 88 Z" fill="#8B8D69" stroke="#2B2118" stroke-width="1.4" />
    <!-- Torch Handle & Golden Flame -->
    <rect x="102" y="24" width="8" height="10" fill="#2B2118" />
    <path d="M 106 24 C 100 16, 102 10, 108 4 C 114 10, 114 16, 106 24 Z" fill="#D9A877" stroke="#2B2118" stroke-width="1.3" />
  </g>
</svg>
