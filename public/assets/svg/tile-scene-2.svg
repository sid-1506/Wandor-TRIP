<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="sky-amalfi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F2" />
      <stop offset="100%" stop-color="#EBE0CC" />
    </linearGradient>
    <linearGradient id="sea-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8DA79A" />
      <stop offset="100%" stop-color="#6F897D" />
    </linearGradient>
    <pattern id="hatch-coast" width="6" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#2B2118" stroke-width="0.8" opacity="0.25" />
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#sky-amalfi)" rx="24" />

  <!-- Sea -->
  <rect y="280" width="800" height="320" fill="url(#sea-grad)" rx="0" />

  <!-- Sunken Sea Wake & Reflections -->
  <g stroke="#FAF6EE" stroke-width="1.6" opacity="0.45" stroke-linecap="round">
    <line x1="120" y1="340" x2="220" y2="340" />
    <line x1="260" y1="365" x2="420" y2="365" />
    <line x1="480" y1="330" x2="580" y2="330" />
    <line x1="160" y1="410" x2="340" y2="410" />
    <line x1="390" y1="440" x2="540" y2="440" />
    <line x1="210" y1="490" x2="450" y2="490" />
  </g>

  <!-- Distant Sailboat -->
  <g transform="translate(490, 310)">
    <polygon points="15,0 15,35 32,35" fill="#FAF6EE" stroke="#2B2118" stroke-width="1.2" />
    <polygon points="12,8 12,35 0,35" fill="#F3EBDB" stroke="#2B2118" stroke-width="1.2" />
    <polygon points="-4,35 36,35 30,42 2,42" fill="#2B2118" />
  </g>

  <!-- Dramatic Amalfi Terracotta Cliff on Left -->
  <path d="M 0 140 
           L 120 180 
           L 200 240 
           L 280 340 
           L 340 480 
           L 360 600 
           L 0 600 Z" 
        fill="#B9643A" />
  <path d="M 0 220 L 100 260 L 180 360 L 220 500 L 240 600 L 0 600 Z" fill="#8E4526" />
  <path d="M 0 140 L 200 240 L 340 480 L 360 600 L 0 600 Z" fill="url(#hatch-coast)" />

  <!-- Stacked Pastel Cliffside Houses -->
  <!-- Top House (Cream) -->
  <g transform="translate(90, 200)">
    <polygon points="0,20 40,20 45,45 0,45" fill="#F8F3EA" stroke="#2B2118" stroke-width="1.3" />
    <polygon points="-5,20 20,5 45,20" fill="#B9643A" stroke="#2B2118" stroke-width="1.3" />
    <rect x="8" y="26" width="8" height="12" fill="#2B2118" />
    <rect x="24" y="26" width="8" height="12" fill="#2B2118" />
  </g>
  <!-- Mid House (Terracotta Rose) -->
  <g transform="translate(140, 250)">
    <polygon points="0,25 50,25 55,60 0,60" fill="#D9A877" stroke="#2B2118" stroke-width="1.3" />
    <polygon points="-5,25 25,8 55,25" fill="#8E4526" stroke="#2B2118" stroke-width="1.3" />
    <rect x="12" y="32" width="10" height="14" rx="5" fill="#2B2118" />
    <rect x="30" y="32" width="10" height="14" rx="5" fill="#2B2118" />
  </g>
  <!-- Lower House (Pale Sage) -->
  <g transform="translate(190, 320)">
    <polygon points="0,30 60,30 65,75 0,75" fill="#C3C7AB" stroke="#2B2118" stroke-width="1.3" />
    <polygon points="-5,30 30,10 65,30" fill="#B9643A" stroke="#2B2118" stroke-width="1.3" />
    <rect x="15" y="40" width="12" height="16" fill="#2B2118" />
    <rect x="38" y="40" width="12" height="16" fill="#2B2118" />
  </g>

  <!-- Mediterranean Umbrella Pine Tree on Cliff -->
  <g transform="translate(230, 260)">
    <path d="M 40 120 C 45 80, 50 40, 60 10" stroke="#2B2118" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="65" cy="10" rx="45" ry="18" fill="#5E6045" stroke="#2B2118" stroke-width="1.5" />
    <ellipse cx="60" cy="5" rx="35" ry="14" fill="#787C58" />
  </g>
</svg>
